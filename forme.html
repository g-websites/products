<div id="notice" class="notice"></div>
<script>
const $ = s => document.querySelector(s);
let noticeTimer;
function toast(s){const n=$('#notice');n.textContent=s;n.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.remove('show'),2200)}
// 窄屏导航折叠：汉堡按钮切换下拉菜单
const navToggle=document.getElementById('nav-toggle'),siteNav=document.getElementById('site-nav');
if(navToggle&&siteNav){
  function setNav(open){
    siteNav.classList.toggle('open',open);
    navToggle.classList.toggle('open',open);
    navToggle.setAttribute('aria-expanded',String(open));
    navToggle.setAttribute('aria-label',open?'关闭菜单':'打开菜单');
  }
  navToggle.addEventListener('click',e=>{e.stopPropagation();setNav(!siteNav.classList.contains('open'))});
  siteNav.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setNav(false)));
  document.addEventListener('click',e=>{
    if(!siteNav.contains(e.target)&&!navToggle.contains(e.target))setNav(false);
  });
}
async function toggleLike(id, btn){
  const r = await fetch('/api/projects/'+id+'/like', {method:'POST', credentials:'same-origin'});
  const data = await r.json().catch(()=>({detail:r.statusText}));
  if(!r.ok) throw new Error(data.detail || r.statusText);
  btn.classList.toggle('liked', data.liked);
  btn.innerHTML = (data.liked ? '♥' : '♡') + ' <b>' + data.likes + '</b>';
  return data;
}
document.addEventListener('click', async e=>{
  const l = e.target.closest('[data-like]');
  if(!l) return;
  e.preventDefault();
  try{
    const data = await toggleLike(Number(l.dataset.like), l);
    toast(data.liked ? '感谢你的喜欢 ♥' : '已取消点赞');
  }catch(err){ toast(err.message); }
});

</script>
